[package]
name = "rustfish"
version = "0.2.0"
edition = "2021"
description = "A node-for-node faithful Rust rewrite of the Stockfish chess engine"
license = "GPL-3.0-or-later"
repository = "https://github.com/avunit1/rustfish"
keywords = ["chess", "chess-engine", "nnue", "stockfish", "uci"]
categories = ["games"]
publish = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

[dependencies]